<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Sửa thiết bị')}"></th:block>
</head>
<body class="bg-slate-50">

<aside th:replace="~{fragments/layout :: sidebar('ADMIN', ${activePage})}"></aside>

<div class="ml-64 min-h-screen">
    <header th:replace="~{fragments/layout :: topbar('Chỉnh sửa thiết bị')}"></header>

    <main class="p-8">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="max-w-3xl mx-auto app-card p-6">
            <div class="flex items-center gap-3 mb-6">
                <a th:href="@{/admin/equipment}"
                   class="w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center hover:bg-slate-100">
                    <i class="fa-solid fa-arrow-left text-slate-600"></i>
                </a>
                <div>
                    <h2 class="font-bold text-slate-900" th:text="'Sửa: ' + ${equipment.name}">Sửa</h2>
                    <p class="text-xs text-slate-500 font-mono" th:text="${equipment.code}">CODE</p>
                </div>
            </div>

            <form th:action="@{/admin/equipment/{id}/edit(id=${equipment.id})}" th:object="${equipmentDTO}"
                  method="post" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Mã thiết bị *</label>
                        <input type="text" th:field="*{code}" required class="app-input font-mono"/>
                        <span class="text-xs text-red-600" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Đơn vị</label>
                        <input type="text" th:field="*{unit}" class="app-input"/>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Tên thiết bị *</label>
                    <input type="text" th:field="*{name}" required class="app-input"/>
                    <span class="text-xs text-red-600" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Mô tả</label>
                    <textarea th:field="*{description}" rows="3" class="app-input"></textarea>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Tổng số lượng *</label>
                        <input type="number" th:field="*{quantity}" min="0" required class="app-input"/>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Còn lại</label>
                        <input type="number" th:field="*{available}" min="0" class="app-input"/>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Phí đặt cọc (VND)</label>
                    <input type="number" th:field="*{depositAmount}" min="0" step="1000" class="app-input"/>
                    <p class="text-xs text-slate-500 mt-1">Số tiền sinh viên cần đặt cọc khi mượn thiết bị này. Để 0 nếu không yêu cầu.</p>
                </div>
                <label class="flex items-center gap-2 text-sm font-medium">
                    <input type="checkbox" th:field="*{isActive}" class="rounded"/>
                    Đang hoạt động (hiển thị cho giảng viên chọn)
                </label>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <a th:href="@{/admin/equipment}"
                       class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 font-semibold">Hủy</a>
                    <button type="submit" class="btn-primary-main">
                        <i class="fa-solid fa-floppy-disk"></i> Cập nhật
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>

</body>
</html>
