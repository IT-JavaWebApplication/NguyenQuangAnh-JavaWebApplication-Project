<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quản lý thiết bị | Rikkei Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link rel="stylesheet" th:href="@{/css/admin.css}"/>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}"/>
</head>
<body class="admin-layout">

<aside th:replace="~{fragments/admin_sidebar :: sidebar('equipment')}"></aside>
<div class="admin-main">
    <div class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Kho Thiết Bị Công Nghệ</h1>
            <p class="text-sm text-slate-500 mt-1">Quản lý danh mục vật tư cơ sở vật chất phòng Lab</p>
        </div>
        <button onclick="openAddModal()" class="flex items-center gap-2 bg-[#0052cc] hover:bg-[#0044aa] text-white px-5 py-2.5 rounded-xl font-medium shadow-md shadow-blue-500/10 transition-all active:scale-[0.97]">
            <span class="material-symbols-outlined text-[20px]">add_circle</span> Thêm Thiết Bị Mới
        </button>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="bg-slate-50/75 border-b border-slate-100 text-xs font-bold text-slate-500 uppercase tracking-wider">
                <th class="px-6 py-4">Tên thiết bị</th>
                <th class="px-6 py-4">Mã Code</th>
                <th class="px-6 py-4">Tổng Kho</th>
                <th class="px-6 py-4">Đơn vị</th>
                <th class="px-6 py-4 text-right">Thao tác</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-50">
            <tr th:each="e : ${equipments}" class="data-table-row hover:bg-slate-50/50 transition-colors">
                <td class="px-6 py-4 font-semibold text-slate-900" th:text="${e.name}">Kính hiển vi quang học</td>
                <td class="px-6 py-4 text-slate-600 font-mono text-sm" th:text="${e.code}">LAB-MIC-002</td>
                <td class="px-6 py-4 font-bold text-slate-700" th:text="${e.totalQuantity}">15</td>
                <td class="px-6 py-4 text-slate-500" th:text="${e.unit}">Cái</td>
                <td class="px-6 py-4 text-right flex justify-end gap-2">
                    <a th:href="@{/admin/equipment/{id}/edit(id=${e.id})}" class="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-colors">
                        <span class="material-symbols-outlined text-[20px]">edit</span>
                    </a>
                    <form th:action="@{/admin/equipment/{id}/delete(id=${e.id})}" method="post" onsubmit="return confirm('Bạn chắc chắn muốn xoá thiết bị này?')" class="inline">
                        <button type="submit" class="p-2 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors">
                            <span class="material-symbols-outlined text-[20px]">delete</span>
                        </button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(equipments)}">
                <td colspan="5" class="px-6 py-12 text-center text-slate-400">Không tìm thấy thiết bị nào trong kho.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div id="addEquipmentModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 transition-all">
    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 max-w-md w-full overflow-hidden p-6 animate-in fade-in zoom-in-95 duration-200">
        <div class="flex justify-between items-center pb-4 border-b border-slate-100">
            <h3 class="text-lg font-bold text-slate-900">Khai báo thiết bị mới</h3>
            <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600"><span class="material-symbols-outlined">close</span></button>
        </div>
        <form th:action="@{/admin/equipment/add}" method="post" class="space-y-4 mt-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Tên thiết bị *</label>
                <input type="text" name="name" required class="w-full border border-slate-200 rounded-xl px-4 py-2" />
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Mã thiết bị (Code) *</label>
                <input type="text" name="code" required class="w-full border border-slate-200 rounded-xl px-4 py-2" />
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Số lượng *</label>
                    <input type="number" name="totalQuantity" min="1" required class="w-full border border-slate-200 rounded-xl px-4 py-2" />
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Đơn vị tính</label>
                    <input type="text" name="unit" placeholder="Cái, Bộ..." class="w-full border border-slate-200 rounded-xl px-4 py-2" />
                </div>
            </div>
            <div class="pt-4 flex justify-end gap-2">
                <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-xl">Hủy</button>
                <button type="submit" class="px-6 py-2 bg-[#0052cc] text-white rounded-xl font-medium">Lưu lại</button>
            </div>
        </form>
    </div>
</div>

<script>
    function openAddModal() { document.getElementById('addEquipmentModal').classList.remove('hidden'); document.getElementById('addEquipmentModal').classList.add('flex'); }
    function closeAddModal() { document.getElementById('addEquipmentModal').classList.add('hidden'); document.getElementById('addEquipmentModal').classList.remove('flex'); }
</script>
</body>
</html>
