<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Quản lý thiết bị')}"></th:block>
</head>
<body class="bg-slate-50">

<aside th:replace="~{fragments/layout :: sidebar('ADMIN', ${activePage})}"></aside>

<div class="ml-64 min-h-screen">
    <header th:replace="~{fragments/layout :: topbar('Quản lý danh mục thiết bị')}"></header>

    <main class="p-8">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="app-card overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <div>
                    <h2 class="font-bold text-slate-900">Danh mục thiết bị</h2>
                    <p class="text-xs text-slate-500">Thêm, sửa và quản lý toàn bộ thiết bị thực hành</p>
                </div>
                <button onclick="document.getElementById('addModal').classList.remove('hidden')"
                        class="btn-primary-main">
                    <i class="fa-solid fa-plus"></i> Thêm thiết bị mới
                </button>
            </div>

            <table class="app-table">
                <thead>
                <tr>
                    <th>Mã</th>
                    <th>Tên thiết bị</th>
                    <th class="text-center">Tổng SL</th>
                    <th class="text-center">Còn lại</th>
                    <th>Đơn vị</th>
                    <th class="text-right">Đặt cọc</th>
                    <th class="text-center">Trạng thái</th>
                    <th class="text-right">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${equipments}">
                    <td class="font-mono text-xs text-slate-500" th:text="${e.code}">CODE</td>
                    <td>
                        <div class="font-semibold text-slate-800" th:text="${e.name}">Tên</div>
                        <div class="text-xs text-slate-500 max-w-md truncate" th:text="${e.description}">Mô tả</div>
                    </td>
                    <td class="text-center font-bold" th:text="${e.quantity}">0</td>
                    <td class="text-center">
                        <span class="font-bold"
                              th:classappend="${e.available > 0 ? 'text-emerald-700' : 'text-red-600'}"
                              th:text="${e.available}">0</span>
                    </td>
                    <td class="text-xs text-slate-500" th:text="${e.unit}">Cái</td>
                    <td class="text-right">
                        <span th:if="${e.depositAmount != null and e.depositAmount.signum() > 0}"
                              class="font-semibold text-rose-600">
                            <span th:text="${#numbers.formatDecimal(e.depositAmount, 0, 'COMMA', 0, 'POINT')}">0</span>
                            <span class="text-xs text-slate-400">đ</span>
                        </span>
                        <span th:unless="${e.depositAmount != null and e.depositAmount.signum() > 0}" class="text-xs text-slate-400">—</span>
                    </td>
                    <td class="text-center">
                        <span th:if="${e.isActive}" class="badge-status badge-completed">Hoạt động</span>
                        <span th:unless="${e.isActive}" class="badge-status badge-cancelled">Ngừng</span>
                    </td>
                    <td class="text-right">
                        <a th:href="@{/admin/equipment/{id}/edit(id=${e.id})}"
                           class="px-3 py-1.5 text-xs font-semibold text-blue-600 hover:bg-blue-50 rounded-md inline-flex items-center gap-1">
                            <i class="fa-solid fa-pen-to-square"></i> Sửa
                        </a>
                        <form th:action="@{/admin/equipment/{id}/delete(id=${e.id})}" method="post"
                              data-confirm="Thiết bị sẽ được chuyển sang trạng thái Ngừng hoạt động (soft delete). Bạn có thể kích hoạt lại sau."
                              data-confirm-title="Xoá thiết bị?"
                              data-confirm-ok="Xoá thiết bị"
                              data-confirm-style="danger"
                              class="inline">
                            <button type="submit"
                                    class="px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50 rounded-md inline-flex items-center gap-1">
                                <i class="fa-solid fa-trash"></i> Xoá
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(equipments)}">
                    <td colspan="8" class="text-center text-slate-400 py-10">
                        <i class="fa-solid fa-boxes-stacked text-3xl mb-2 block"></i>
                        Chưa có thiết bị nào trong kho
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<!-- Add modal -->
<div id="addModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden items-center justify-center p-4 flex"
     th:classappend="${openAddModal != null and openAddModal} ? '' : 'hidden'">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-lg">
        <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100">
            <h3 class="font-bold text-slate-900">Thêm thiết bị mới</h3>
            <button onclick="document.getElementById('addModal').classList.add('hidden')"
                    class="text-slate-400 hover:text-slate-700"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
        <form th:action="@{/admin/equipment/create}" th:object="${equipmentDTO}" method="post" class="p-6 space-y-4">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Mã thiết bị *</label>
                    <input type="text" th:field="*{code}" required class="app-input font-mono" placeholder="EQ-PC-02"/>
                    <span class="text-xs text-red-600" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></span>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Đơn vị</label>
                    <input type="text" th:field="*{unit}" class="app-input" placeholder="Cái / Bộ / Quyển..."/>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Tên thiết bị *</label>
                <input type="text" th:field="*{name}" required class="app-input"/>
                <span class="text-xs text-red-600" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Mô tả</label>
                <textarea th:field="*{description}" rows="3" class="app-input"></textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Tổng số lượng *</label>
                    <input type="number" th:field="*{quantity}" min="0" required class="app-input"/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Còn lại</label>
                    <input type="number" th:field="*{available}" min="0" class="app-input"
                           placeholder="(mặc định = tổng SL)"/>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Phí đặt cọc (VND)</label>
                <input type="number" th:field="*{depositAmount}" min="0" step="1000" class="app-input"
                       placeholder="0 = không yêu cầu đặt cọc"/>
                <p class="text-xs text-slate-500 mt-1">Số tiền sinh viên cần đặt cọc khi mượn thiết bị này.</p>
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                <button type="button" onclick="document.getElementById('addModal').classList.add('hidden')"
                        class="px-5 py-2 rounded-lg border border-slate-300 hover:bg-slate-50 font-semibold">Hủy</button>
                <button type="submit" class="btn-primary-main">
                    <i class="fa-solid fa-floppy-disk"></i> Lưu thiết bị
                </button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/layout :: confirmModal}"></div>

</body>
</html>
