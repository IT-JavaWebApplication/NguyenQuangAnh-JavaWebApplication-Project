<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Chi tiết phiếu mượn')}"></th:block>
</head>
<body class="bg-slate-50">

<aside th:replace="~{fragments/layout :: sidebar('ADMIN', ${activePage})}"></aside>

<div class="ml-64 min-h-screen">
    <header th:replace="~{fragments/layout :: topbar('Chi tiết phiếu mượn')}"></header>

    <main class="p-8">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="max-w-4xl mx-auto">
            <div class="flex items-center gap-3 mb-6">
                <a th:href="@{/admin/borrowing}"
                   class="w-9 h-9 rounded-lg border border-slate-200 flex items-center justify-center hover:bg-slate-100">
                    <i class="fa-solid fa-arrow-left text-slate-600"></i>
                </a>
                <div>
                    <h2 class="font-bold text-slate-900">Phiếu mượn #<span th:text="${record.id}"></span></h2>
                    <p class="text-xs text-slate-500">Buổi tư vấn ID <span th:text="${record.session.id}"></span></p>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="app-card p-5">
                    <div class="text-xs text-slate-500 uppercase font-bold">Sinh viên</div>
                    <div class="font-bold text-slate-900 mt-1"
                         th:text="${record.student.profile != null ? record.student.profile.fullName : record.student.username}">Tên</div>
                    <div class="text-xs text-slate-500" th:text="${record.student.email}">email</div>
                </div>
                <div class="app-card p-5">
                    <div class="text-xs text-slate-500 uppercase font-bold">Hạn trả</div>
                    <div class="font-bold text-slate-900 mt-1"
                         th:text="${record.dueDate != null ? #temporals.format(record.dueDate, 'dd/MM/yyyy') : 'Chưa định'}">—</div>
                </div>
                <div class="app-card p-5">
                    <div class="text-xs text-slate-500 uppercase font-bold">Trạng thái</div>
                    <div class="mt-1">
                        <span th:switch="${record.status.name()}">
                            <span th:case="'PENDING_DISPATCH'" class="badge-status badge-pendingdis">Chờ cấp phát</span>
                            <span th:case="'DISPATCHED'"       class="badge-status badge-dispatched">Đã xuất kho</span>
                            <span th:case="'RETURNED'"         class="badge-status badge-returned">Đã trả</span>
                            <span th:case="'OVERDUE'"          class="badge-status badge-overdue">Quá hạn</span>
                            <span th:case="'CANCELLED'"        class="badge-status badge-cancelled">Đã hủy</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="app-card overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100">
                    <h3 class="font-bold text-slate-900">Danh sách thiết bị</h3>
                </div>
                <table class="app-table">
                    <thead>
                    <tr>
                        <th>Mã</th>
                        <th>Tên</th>
                        <th class="text-center">Số lượng</th>
                        <th class="text-center">Đã trả</th>
                        <th class="text-center">Tồn kho hiện tại</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="d : ${record.details}">
                        <td class="font-mono text-xs text-slate-500" th:text="${d.equipment.code}">CODE</td>
                        <td class="font-semibold" th:text="${d.equipment.name}">Tên</td>
                        <td class="text-center font-bold" th:text="${d.quantity} + ' ' + ${d.equipment.unit}">SL</td>
                        <td class="text-center" th:text="${d.returnQuantity}">0</td>
                        <td class="text-center text-emerald-700 font-semibold" th:text="${d.equipment.available}">0</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${record.adminNote != null and !record.adminNote.isEmpty()}"
                 class="app-card p-5 mt-4">
                <div class="text-xs font-bold text-slate-700 uppercase mb-1">Ghi chú admin</div>
                <p class="text-sm text-slate-700" th:text="${record.adminNote}"></p>
            </div>

            <div th:if="${record.status.name() == 'PENDING_DISPATCH'}" class="mt-6 flex justify-end">
                <form th:action="@{/admin/borrowing/{id}/dispatch(id=${record.id})}" method="post"
                      data-confirm="Xác nhận xuất kho cho phiếu mượn này? Tồn kho sẽ được cập nhật tự động."
                      data-confirm-title="Xác nhận xuất kho"
                      data-confirm-ok="Xuất kho"
                      data-confirm-style="primary">
                    <button type="submit" class="btn-primary-main">
                        <i class="fa-solid fa-truck-fast"></i> Xác nhận xuất kho
                    </button>
                </form>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: confirmModal}"></div>

</body>
</html>
