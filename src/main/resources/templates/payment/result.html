<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Kết quả thanh toán')}"></th:block>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 p-4 flex items-center justify-center">

<div class="w-full max-w-xl">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 overflow-hidden">

        <!-- Success header -->
        <div th:if="${isSuccess}" class="bg-gradient-to-br from-emerald-500 to-green-600 text-white p-8 text-center">
            <div class="w-20 h-20 mx-auto rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center mb-4">
                <i class="fa-solid fa-circle-check text-5xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold">Thanh toán thành công!</h1>
            <p class="text-emerald-100 mt-1">Lịch tư vấn của bạn đã được xác nhận và chờ giảng viên tiếp nhận</p>
        </div>

        <!-- Fail header -->
        <div th:unless="${isSuccess}" class="bg-gradient-to-br from-red-500 to-rose-600 text-white p-8 text-center">
            <div class="w-20 h-20 mx-auto rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center mb-4">
                <i class="fa-solid fa-circle-xmark text-5xl"></i>
            </div>
            <h1 class="text-2xl font-extrabold">Thanh toán thất bại</h1>
            <p class="text-red-100 mt-1" th:text="${payment.responseMessage ?: 'Giao dịch không thành công'}">Lý do</p>
        </div>

        <!-- Details -->
        <div class="p-6 space-y-3">
            <div class="flex justify-between text-sm">
                <span class="text-slate-500">Mã giao dịch</span>
                <span class="font-mono font-semibold" th:text="${payment.txnRef}">TXN</span>
            </div>
            <div class="flex justify-between text-sm" th:if="${payment.gatewayTxnId != null}">
                <span class="text-slate-500">Mã GD cổng thanh toán</span>
                <span class="font-mono text-xs" th:text="${payment.gatewayTxnId}">GW</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-slate-500">Phương thức</span>
                <span class="font-medium" th:text="${payment.method.displayName}">VNPay</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-slate-500">Nội dung</span>
                <span class="font-medium text-right max-w-xs" th:text="${payment.description}">Mô tả</span>
            </div>
            <div class="flex justify-between text-sm">
                <span class="text-slate-500">Thời gian</span>
                <span class="font-medium" th:text="${#temporals.format(payment.updatedAt, 'HH:mm:ss dd/MM/yyyy')}">Time</span>
            </div>

            <div class="border-t border-slate-100 pt-3 flex justify-between items-center">
                <span class="text-slate-700 font-semibold">Số tiền</span>
                <span class="text-2xl font-extrabold"
                      th:classappend="${isSuccess ? 'text-emerald-600' : 'text-slate-700'}">
                    <span th:text="${#numbers.formatDecimal(payment.amount, 0, 'COMMA', 0, 'POINT')}">0</span>
                    <span class="text-sm ml-1">VND</span>
                </span>
            </div>
        </div>

        <!-- Actions -->
        <div class="bg-slate-50 px-6 py-4 flex flex-col sm:flex-row gap-3 justify-center">
            <a th:href="@{/student/dashboard}"
               class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-semibold inline-flex items-center justify-center gap-2">
                <i class="fa-solid fa-gauge-high"></i> Về bảng điều khiển
            </a>
            <a th:href="@{/payment/history}"
               class="px-5 py-2.5 rounded-lg border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold inline-flex items-center justify-center gap-2">
                <i class="fa-solid fa-receipt"></i> Lịch sử giao dịch
            </a>
            <form th:if="${!isSuccess and payment.session != null}"
                  th:action="@{/payment/session/{id}/checkout(id=${payment.session.id})}" method="post">
                <button type="submit"
                        class="px-5 py-2.5 rounded-lg bg-amber-500 hover:bg-amber-600 text-white font-semibold inline-flex items-center justify-center gap-2 w-full">
                    <i class="fa-solid fa-arrow-rotate-right"></i> Thử thanh toán lại
                </button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
