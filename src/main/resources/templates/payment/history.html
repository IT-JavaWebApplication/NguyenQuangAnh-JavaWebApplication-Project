<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Lịch sử giao dịch')}"></th:block>
</head>
<body class="bg-slate-50">

<aside th:replace="~{fragments/layout :: sidebar('STUDENT', ${activePage})}"></aside>

<div class="ml-64 min-h-screen">
    <header th:replace="~{fragments/layout :: topbar('Lịch sử giao dịch thanh toán')}"></header>

    <main class="p-8">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="app-card overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-100">
                <h2 class="font-bold text-slate-900">Tất cả giao dịch của bạn</h2>
                <p class="text-xs text-slate-500">Bao gồm cả thành công, thất bại và đang chờ xử lý</p>
            </div>
            <table class="app-table">
                <thead>
                <tr>
                    <th>Mã GD</th>
                    <th>Loại</th>
                    <th>Mô tả</th>
                    <th class="text-right">Số tiền</th>
                    <th>Phương thức</th>
                    <th>Thời gian</th>
                    <th>Trạng thái</th>
                    <th class="text-right">Thao tác</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${payments}">
                    <td class="font-mono text-xs text-slate-500" th:text="${p.txnRef}">TXN</td>
                    <td class="text-xs" th:text="${p.type.displayName}">Loại</td>
                    <td class="max-w-xs truncate" th:text="${p.description}">Mô tả</td>
                    <td class="text-right font-bold">
                        <span th:text="${#numbers.formatDecimal(p.amount, 0, 'COMMA', 0, 'POINT')}">0</span>
                        <span class="text-xs text-slate-400">đ</span>
                    </td>
                    <td class="text-xs" th:text="${p.method.displayName}">Method</td>
                    <td class="text-xs text-slate-500"
                        th:text="${#temporals.format(p.createdAt, 'HH:mm dd/MM/yyyy')}">Time</td>
                    <td>
                        <span th:switch="${p.status.name()}">
                            <span th:case="'PENDING'"     class="badge-status badge-pending">Chờ thanh toán</span>
                            <span th:case="'PROCESSING'"  class="badge-status badge-pendingdis">Đang xử lý</span>
                            <span th:case="'SUCCESS'"     class="badge-status badge-completed">Thành công</span>
                            <span th:case="'FAILED'"      class="badge-status badge-cancelled">Thất bại</span>
                            <span th:case="'CANCELLED'"   class="badge-status badge-cancelled">Đã hủy</span>
                            <span th:case="'REFUNDED'"    class="badge-status badge-confirmed">Đã hoàn tiền</span>
                        </span>
                    </td>
                    <td class="text-right">
                        <a th:href="@{/payment/result/{ref}(ref=${p.txnRef})}"
                           class="px-3 py-1.5 text-xs font-semibold text-blue-600 hover:bg-blue-50 rounded-md">
                            <i class="fa-solid fa-eye"></i> Chi tiết
                        </a>
                        <form th:if="${p.status.name() == 'PENDING' and p.session != null}"
                              th:action="@{/payment/session/{id}/checkout(id=${p.session.id})}" method="post"
                              class="inline">
                            <button type="submit"
                                    class="px-3 py-1.5 text-xs font-semibold text-amber-700 hover:bg-amber-50 rounded-md">
                                <i class="fa-solid fa-arrow-rotate-right"></i> Tiếp tục
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(payments)}">
                    <td colspan="8" class="text-center text-slate-400 py-10">
                        <i class="fa-solid fa-receipt text-3xl mb-2 block"></i>
                        Bạn chưa có giao dịch nào.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

</body>
</html>
