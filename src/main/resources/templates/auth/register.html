<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Đăng ký')}"></th:block>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-100 p-4 py-10">

<div class="w-full max-w-2xl">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl shadow-lg mb-3">
            <i class="fa-solid fa-user-plus text-xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-slate-900">Tạo tài khoản sinh viên</h1>
        <p class="text-sm text-slate-500 mt-1">Đăng ký để bắt đầu sử dụng hệ thống</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">
        <div th:if="${errorMsg}" class="flash flash-error">
            <i class="fa-solid fa-circle-exclamation mr-2"></i><span th:text="${errorMsg}"></span>
        </div>

        <form th:action="@{/auth/register}" th:object="${registerDTO}" method="POST" class="space-y-4">

            <div>
                <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Họ và tên *</label>
                <input type="text" th:field="*{fullName}" required
                       th:errorclass="is-invalid"
                       class="app-input"
                       placeholder="Nguyễn Văn A"/>
                <span class="text-xs text-red-600 mt-1 block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Tên đăng nhập *</label>
                    <input type="text" th:field="*{username}" required
                           th:errorclass="is-invalid"
                           class="app-input"
                           placeholder="vd: student01"/>
                    <span class="text-xs text-red-600 mt-1 block" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Email *</label>
                    <input type="email" th:field="*{email}" required
                           th:errorclass="is-invalid"
                           class="app-input"
                           placeholder="email@edu.vn"/>
                    <span class="text-xs text-red-600 mt-1 block" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mật khẩu *</label>
                    <input type="password" th:field="*{password}" required
                           th:errorclass="is-invalid"
                           class="app-input"
                           placeholder="Tối thiểu 6 ký tự"/>
                    <span class="text-xs text-red-600 mt-1 block" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Xác nhận mật khẩu *</label>
                    <input type="password" th:field="*{confirmPassword}" required
                           th:errorclass="is-invalid"
                           class="app-input"
                           placeholder="Nhập lại mật khẩu"/>
                    <span class="text-xs text-red-600 mt-1 block" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Số điện thoại</label>
                    <input type="text" th:field="*{phone}" class="app-input" placeholder="0901..."/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Mã sinh viên</label>
                    <input type="text" th:field="*{studentCode}" class="app-input" placeholder="SV2026..."/>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Lớp</label>
                    <input type="text" th:field="*{className}" class="app-input" placeholder="K26-CNTT01"/>
                </div>
            </div>

            <button type="submit"
                    class="btn-primary-main w-full justify-center text-base">
                <i class="fa-solid fa-user-check"></i> Đăng ký
            </button>
        </form>

        <div class="mt-6 pt-6 border-t border-slate-100 text-center text-sm text-slate-500">
            Đã có tài khoản?
            <a th:href="@{/auth/login}" class="text-blue-600 font-semibold hover:underline ml-1">Đăng nhập</a>
        </div>
    </div>
</div>

</body>
</html>
