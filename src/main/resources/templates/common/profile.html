<!DOCTYPE html>
<!-- File: src/main/resources/templates/common/profile.html -->
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hồ sơ cá nhân — LabNexus</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
  <!-- Sidebar tự điều chỉnh theo role -->
  <aside class="sidebar"
         th:if="${currentUser?.role?.name() == 'STUDENT'}"
         th:insert="~{fragments/layout :: sidebar('profile', 'STUDENT')}"></aside>
  <aside class="sidebar"
         th:if="${currentUser?.role?.name() == 'LECTURER'}"
         th:insert="~{fragments/layout :: sidebar('profile', 'LECTURER')}"></aside>
  <aside class="sidebar"
         th:if="${currentUser?.role?.name() == 'ADMIN'}"
         th:insert="~{fragments/layout :: sidebar('profile', 'ADMIN')}"></aside>

  <header class="topbar">
    <div><div class="topbar-title">Hồ sơ cá nhân</div></div>
    <div class="topbar-spacer"></div>
    <div class="topbar-avatar" th:text="${#strings.substring((currentUser?.fullName ?: 'U'),0,1)}">U</div>
  </header>

  <main class="main-content fade-in">

    <div th:if="${success}" class="alert alert-success mb-16"><i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span></div>

    <div class="grid-1-2">
      <!-- Profile card -->
      <div style="display:flex;flex-direction:column;gap:16px;">
        <div class="card">
          <div class="card-body" style="text-align:center;padding:32px;">
            <div class="avatar-big" style="margin:0 auto 16px;"
                 th:text="${#strings.substring((currentUser?.fullName ?: 'U'),0,1)}">U</div>
            <div class="fw-600" style="font-size:1.1rem;" th:text="${currentUser?.fullName}">Full Name</div>
            <div class="text-sm text-muted mt-4" th:text="'@' + ${currentUser?.username}">@username</div>
            <div class="mt-8">
              <span th:switch="${currentUser?.role?.name()}">
                <span th:case="'STUDENT'"  class="badge badge-blue">Sinh viên</span>
                <span th:case="'LECTURER'" class="badge badge-amber">Giảng viên</span>
                <span th:case="'ADMIN'"    class="badge badge-red">Admin</span>
              </span>
            </div>
            <div class="divider"></div>
            <div class="d-flex justify-between mb-8">
              <span class="text-sm text-muted">Email</span>
              <span class="text-sm fw-600" th:text="${currentUser?.email}">email@edu.vn</span>
            </div>
            <div class="d-flex justify-between mb-8">
              <span class="text-sm text-muted">Điện thoại</span>
              <span class="text-sm" th:text="${currentUser?.userProfile?.phone ?: 'Chưa cập nhật'}">—</span>
            </div>
            <div class="d-flex justify-between">
              <span class="text-sm text-muted">Ngày tạo</span>
              <span class="text-sm"
                    th:text="${#temporals.format(currentUser?.createdAt,'dd/MM/yyyy')}">—</span>
            </div>
          </div>
        </div>

        <!-- Change password -->
        <div class="card">
          <div class="card-header"><span class="card-title"><i class="fa-solid fa-lock" ></i>Đổi mật khẩu</span></div>
          <div class="card-body">
            <form th:action="@{/profile/change-password}" method="post">
              <div class="form-group">
                <label class="form-label">Mật khẩu hiện tại</label>
                <input type="password" class="form-control" name="currentPassword" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Mật khẩu mới</label>
                <input type="password" class="form-control" name="newPassword" placeholder="Tối thiểu 6 ký tự" required/>
              </div>
              <div class="form-group mb-0">
                <label class="form-label">Xác nhận mật khẩu mới</label>
                <input type="password" class="form-control" name="confirmPassword" required/>
              </div>
              <button type="submit" class="btn btn-primary w-100 mt-16" style="justify-content:center;">
                <i class="fa-solid fa-key"></i> Cập nhật mật khẩu
              </button>
            </form>
          </div>
        </div>
      </div>

      <!-- Edit profile form -->
      <div class="card">
        <div class="card-header">
          <span class="card-title"><i class="fa-regular fa-pen-to-square"></i>Cập nhật thông tin</span>
        </div>
        <div class="card-body">
          <form th:action="@{/profile/update}" method="post">
            <div class="form-group">
              <label class="form-label">Họ và tên <span >*</span></label>
              <input type="text" class="form-control" name="fullName"
                     th:value="${currentUser?.fullName}" required/>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Email <span >*</span></label>
                <input type="email" class="form-control" name="email"
                       th:value="${currentUser?.email}" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Số điện thoại</label>
                <input type="text" class="form-control" name="phone"
                       th:value="${currentUser?.userProfile?.phone}"/>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Địa chỉ</label>
              <input type="text" class="form-control" name="address"
                     th:value="${currentUser?.userProfile?.address}"/>
            </div>

            <!-- Lecturer only -->
            <div th:if="${currentUser?.role?.name() == 'LECTURER'}">
              <div class="form-group">
                <label class="form-label">Chuyên môn</label>
                <input type="text" class="form-control" name="specialization"
                       th:value="${lecturer?.specialization}"
                       placeholder="VD: Lập trình Java, Machine Learning"/>
              </div>
              <div class="form-group">
                <label class="form-label">Giới thiệu bản thân</label>
                <textarea class="form-control" name="bio" rows="3"
                          th:text="${lecturer?.bio}" placeholder="Mô tả ngắn về bản thân..."></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="justify-content:center;">
              <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
