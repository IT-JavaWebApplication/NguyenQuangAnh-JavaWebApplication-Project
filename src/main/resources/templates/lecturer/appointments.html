<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lịch hẹn tư vấn — LabNexus</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" th:insert="~{fragments/layout :: sidebar('appointments', 'LECTURER')}"></aside>

  <main>
    <header class="topbar">
      <div>
        <div class="topbar-title">Lịch hẹn của tôi</div>
        <div class="topbar-subtitle">Xác nhận và quản lý lịch tư vấn sinh viên</div>
      </div>
      <div class="topbar-spacer"></div>
      <div style="font-weight: 600; display: flex; align-items: center; gap: 12px;">
        Thầy An <div style="width: 36px; height: 36px; background: var(--primary); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center;">A</div>
      </div>
    </header>

    <div class="content-wrapper">
      <div class="tabs">
        <a th:href="@{/lecturer/appointments(status='ALL')}" class="tab-item" th:classappend="${currentStatus == 'ALL' or currentStatus == null ? 'active' : ''}">Tất cả</a>
        <a th:href="@{/lecturer/appointments(status='PENDING')}" class="tab-item" th:classappend="${currentStatus == 'PENDING' ? 'active' : ''}">Chờ xác nhận</a>
        <a th:href="@{/lecturer/appointments(status='CONFIRMED')}" class="tab-item" th:classappend="${currentStatus == 'CONFIRMED' ? 'active' : ''}">Đã xác nhận</a>
        <a th:href="@{/lecturer/appointments(status='COMPLETED')}" class="tab-item" th:classappend="${currentStatus == 'COMPLETED' ? 'active' : ''}">Hoàn thành</a>
      </div>

      <div class="card table-responsive" th:if="${not #lists.isEmpty(sessions)}">
        <table class="table">
          <thead>
          <tr>
            <th>Sinh Viên</th>
            <th>Chủ Đề</th>
            <th>Thời Gian</th>
            <th>Trạng Thái</th>
            <th>Thao Tác</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="s : ${sessions}">
            <td>
              <div style="font-weight: 600;" th:text="${s.student?.fullName}">Trần Minh Quân</div>
            </td>
            <td>
              <div th:text="${s.topic}">Tư vấn AI</div>
            </td>
            <td>
              <div th:text="${#temporals.format(s.appointmentTime, 'HH:mm - dd/MM/yyyy')}">14:00 - 20/10/2023</div>
            </td>
            <td>
                            <span class="badge"
                                  th:classappend="${s.status?.name() == 'CONFIRMED' ? 'bg-primary' :
                                                   (s.status?.name() == 'PENDING' ? 'bg-warning' :
                                                   (s.status?.name() == 'COMPLETED' ? 'bg-success' : 'bg-danger'))}"
                                  th:text="${s.status}">PENDING</span>
            </td>
            <td>
              <div th:if="${s.status?.name() == 'PENDING'}" style="display: flex; gap: 8px;">
                <form th:action="@{/lecturer/sessions/{id}/confirm(id=${s.id})}" method="post">
                  <button type="submit" class="btn btn-primary btn-sm"><i class="fa-solid fa-check"></i> Xác nhận</button>
                </form>
                <form th:action="@{/lecturer/sessions/{id}/cancel(id=${s.id})}" method="post">
                  <button type="submit" class="btn btn-danger btn-sm"><i class="fa-solid fa-xmark"></i></button>
                </form>
              </div>
              <a th:if="${s.status?.name() == 'CONFIRMED'}" th:href="@{/lecturer/evaluate/{id}(id=${s.id})}" class="btn btn-outline btn-sm">
                <i class="fa-regular fa-star"></i> Đánh giá
              </a>
              <span th:if="${s.status?.name() == 'COMPLETED' or s.status?.name() == 'CANCELLED'}" style="color: var(--text-muted); font-size: 0.8rem;">—</span>
            </td>
          </tr>
          </tbody>
        </table>
      </div>

      <div th:if="${#lists.isEmpty(sessions)}" class="empty-state">
        <div class="empty-icon"><i class="fa-regular fa-calendar-xmark"></i></div>
        <p>Chưa có lịch hẹn nào</p>
      </div>
    </div>
  </main>
</div>
</body>
</html>
