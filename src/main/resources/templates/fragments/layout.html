<!DOCTYPE html>
<!-- File: src/main/resources/templates/fragments/layout.html
     Thymeleaf layout fragment — sidebar + topbar dùng chung cho mọi trang -->
<html xmlns:th="http://www.thymeleaf.org"
      th:fragment="html">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle} + ' — LabNexus'">LabNexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

<div class="app-shell">

    <!-- ═══ SIDEBAR ════════════════════════════════════════════ -->
    <aside class="sidebar" th:fragment="sidebar(activeMenu, userRole)">
        <div class="sidebar-brand">
            <h2>Rikkei Lab</h2>
        </div>

        <nav th:if="${userRole == 'STUDENT'}">
            <a th:href="@{/student/dashboard}" th:classappend="${activeMenu == 'dashboard'} ? 'active' : ''" class="nav-item">
                <i class="fa-solid fa-chart-pie"></i> Bảng điều khiển
            </a>
            <a th:href="@{/student/book}" th:classappend="${activeMenu == 'book'} ? 'active' : ''" class="nav-item">
                <i class="fa-solid fa-calendar-plus"></i> Đặt lịch tư vấn
            </a>
            <a th:href="@{/student/history}" th:classappend="${activeMenu == 'history'} ? 'active' : ''" class="nav-item">
                <i class="fa-solid fa-clock-rotate-left"></i> Lịch sử học tập & Mượn thiết bị
            </a>
            <a th:href="@{/profile}" th:classappend="${activeMenu == 'profile'} ? 'active' : ''" class="nav-item">
                <i class="fa-solid fa-user"></i> Hồ sơ cá nhân
            </a>
        </nav>

        <div class="sidebar-footer">
            <form th:action="@{/auth/logout}" method="post">
                <button type="submit" class="nav-item btn-logout">
                    <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
                </button>
            </form>
        </div>
    </aside>

</div><!-- end app-shell placeholder -->
</body>
</html>
