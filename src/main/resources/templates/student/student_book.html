    <!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Đặt lịch — Rikkei Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
    <link rel="stylesheet" th:href="@{/css/styles.css}"/>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" style="position:static; height:auto; min-height:100vh;">
    </aside>

    <div class="main-layout" style="margin-left:0;">
        <main class="content-body" style="padding-top:40px;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">

                <div>
                    <h3 class="section-title-icon"><i class="fa-solid fa-user-tie"></i> Chọn giảng viên</h3>
                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <a th:each="lec : ${lecturers}"
                           th:href="@{/student/book(selectedLecturerId=${lec.id})}"
                           class="lecturer-selectable-card"
                           th:classappend="${bookingRequestDTO.lecturerId == lec.id} ? 'selected' : ''">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <div>
                                    <div style="font-weight:600;" th:text="${lec.fullName}">Dr. Lecturer</div>
                                    <div style="font-size:0.8rem; color:var(--text-muted);" th:text="${lec.email}">lecturer@rikkei.edu</div>
                                </div>
                                <i th:if="${bookingRequestDTO.lecturerId == lec.id}" class="fa-solid fa-circle-check" style="color:var(--primary-blue)"></i>
                                <i th:unless="${bookingRequestDTO.lecturerId == lec.id}" class="fa-regular fa-circle"></i>
                            </div>
                        </a>
                    </div>
                </div>

                <div class="card">
                    <div class="section-title-icon"><i class="fa-regular fa-calendar-plus"></i> Thông tin đặt lịch</div>
                    <form th:action="@{/student/book}" th:object="${bookingRequest}" method="post">
                        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

                        <div class="form-group">
                            <label>Ngày tư vấn *</label>
                            <input type="date" class="form-control" th:field="*{sessionDate}" th:errorclass="is-invalid"/>
                            <span class="invalid-feedback" th:if="${#fields.hasErrors('sessionDate')}" th:errors="*{sessionDate}"></span>
                        </div>
                        <button type="submit" class="btn btn-primary">Xác nhận đặt lịch</button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
