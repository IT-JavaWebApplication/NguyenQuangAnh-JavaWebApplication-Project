<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <th:block th:replace="~{fragments/layout :: pageHead('Hồ sơ cá nhân')}"></th:block>
</head>
<body class="bg-slate-50">

<aside th:replace="~{fragments/layout :: sidebar('STUDENT', ${activePage})}"></aside>

<div class="ml-64 min-h-screen">
    <header th:replace="~{fragments/layout :: topbar('Hồ sơ cá nhân')}"></header>

    <main class="p-8">
        <div th:replace="~{fragments/layout :: flash}"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Profile card -->
            <div class="app-card p-6 text-center h-fit">
                <div class="w-24 h-24 rounded-full bg-gradient-to-br from-blue-500 to-indigo-700 text-white flex items-center justify-center text-3xl font-bold mx-auto mb-3"
                     th:text="${user.profile != null ? #strings.substring(user.profile.fullName, 0, 1) : #strings.substring(user.username, 0, 1)}">P</div>
                <h3 class="font-bold text-slate-900"
                    th:text="${user.profile != null ? user.profile.fullName : user.username}">Họ tên</h3>
                <p class="text-sm text-slate-500" th:text="'@' + ${user.username}">@username</p>
                <span class="inline-block mt-2 px-3 py-1 text-xs font-bold bg-blue-100 text-blue-700 rounded-full">Sinh viên</span>

                <div class="border-t border-slate-100 mt-4 pt-4 space-y-2 text-sm text-left">
                    <div class="flex justify-between"><span class="text-slate-500">Email</span><span class="font-medium truncate ml-2" th:text="${user.email}"></span></div>
                    <div class="flex justify-between" th:if="${user.profile != null and user.profile.phone != null}"><span class="text-slate-500">SĐT</span><span class="font-medium" th:text="${user.profile.phone}"></span></div>
                    <div class="flex justify-between" th:if="${user.profile != null and user.profile.studentCode != null}"><span class="text-slate-500">MSSV</span><span class="font-mono font-medium" th:text="${user.profile.studentCode}"></span></div>
                    <div class="flex justify-between" th:if="${user.profile != null and user.profile.className != null}"><span class="text-slate-500">Lớp</span><span class="font-medium" th:text="${user.profile.className}"></span></div>
                </div>
            </div>

            <!-- Forms -->
            <div class="lg:col-span-2 space-y-6">
                <div class="app-card p-6">
                    <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-regular fa-pen-to-square text-blue-600"></i> Cập nhật thông tin
                    </h3>
                    <form th:action="@{/student/profile}" th:object="${profileDTO}" method="post" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Họ và tên *</label>
                            <input type="text" th:field="*{fullName}" required class="app-input" th:errorclass="is-invalid"/>
                            <span class="text-xs text-red-600 mt-1 block" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Số điện thoại</label>
                                <input type="text" th:field="*{phone}" class="app-input"/>
                                <span class="text-xs text-red-600 mt-1 block" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Mã sinh viên</label>
                                <input type="text" th:field="*{studentCode}" class="app-input"/>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Lớp</label>
                            <input type="text" th:field="*{className}" class="app-input"/>
                        </div>
                        <button type="submit" class="btn-primary-main">
                            <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
                        </button>
                    </form>
                </div>

                <div class="app-card p-6">
                    <h3 class="font-bold text-slate-900 mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-lock text-blue-600"></i> Đổi mật khẩu
                    </h3>
                    <form th:action="@{/profile/change-password}" method="post" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Mật khẩu hiện tại *</label>
                            <input type="password" name="currentPassword" required class="app-input"/>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Mật khẩu mới *</label>
                                <input type="password" name="newPassword" required minlength="6" class="app-input"/>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Xác nhận *</label>
                                <input type="password" name="confirmPassword" required class="app-input"/>
                            </div>
                        </div>
                        <button type="submit" class="btn-primary-main">
                            <i class="fa-solid fa-key"></i> Đổi mật khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

</body>
</html>
