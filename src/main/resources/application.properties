spring.application.name=Smart_Academic-Lab Support_Platform

# ===== DATABASE =====
spring.datasource.url=jdbc:mysql://localhost:3306/smart_academic_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / HIBERNATE =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# Seed data
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# ===== THYMELEAF =====
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ===== MVC =====
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# ===== SERVER =====
server.port=8080

# ===== MAIL =====
# Use a mock/dev SMTP. For real email change host/username/password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=changeme@gmail.com
spring.mail.password=changeme
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# Disable real send in dev to avoid errors: log only
app.mail.dev-mode=true
app.mail.from=noreply@smartacademic.edu.vn

# ===== SCHEDULER =====
app.scheduling.enabled=true
# Overdue threshold in days after the session date
app.borrowing.overdue-days=7

# ===== PAYMENT - VNPay Sandbox =====
# Sandbox: https://sandbox.vnpayment.vn/apis/docs/huong-dan-tich-hop/
# Để test thật: đăng ký merchant sandbox tại sandbox.vnpayment.vn lấy TMN code + Hash secret.
# Để DEMO không cần internet: bật simulate-mode = true → bỏ qua VNPay, gateway giả lập.
# simulate-mode=true: dùng trang giả lập tích hợp trong app (KHÔNG cần internet).
# simulate-mode=false: redirect sang VNPay sandbox thật (cần tmn-code + hash-secret hợp lệ).
app.payment.simulate-mode=true
app.payment.vnpay.tmn-code=2DNSTZQ1
app.payment.vnpay.hash-secret=45J5RKQ8WDBMWWH99F0096VJZI6MKJJF
app.payment.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
app.payment.vnpay.return-url=http://localhost:8080/payment/vnpay-return
app.payment.vnpay.version=2.1.0
# Thời gian timeout giao dịch (phút)
app.payment.expire-minutes=15

# ===== LOGGING =====
logging.level.org.springframework.security=INFO
logging.level.com.smartacademic=DEBUG
